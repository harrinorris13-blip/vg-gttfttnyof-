<button id="cloud-hotspot" type="button" aria-label="Open Study Hub" title="Open Study Hub"></button>
<script>
const studyHubUrl = 'https://cdn.jsdelivr.net/gh/harrinorris13-blip/flabogasted1/Mathhomework_StudyHub_SubjectImages%20(2).html';

document.getElementById('cloud-hotspot').addEventListener('click', function () {
  const newWin = window.open('about:blank', '_blank');
  if (!newWin) return;
  fetch(studyHubUrl + '?t=' + Date.now())
    .then(response => {
      if (!response.ok) throw new Error('Failed to load Study Hub');
      return response.text();
    })
    .then(html => {
      newWin.document.open();
      newWin.document.write(html);
      newWin.document.close();
    })
    .catch(() => { newWin.location.href = studyHubUrl; });
});
</script>
